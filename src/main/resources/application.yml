server:
  port: ${SERVER_PORT:8095}

spring:
  application:
    name: learning-utility
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5433}/${POSTGRES_DB:utility}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres}
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

apns:
  # Token-based APNs auth (.p8 signing key) — doesn't expire like a .p12 certificate.
  enabled: ${APNS_ENABLED:false}
  signing-key-path: ${APNS_SIGNING_KEY_PATH:}
  team-id: ${APNS_TEAM_ID:}
  key-id: ${APNS_KEY_ID:}
  topic: ${APNS_TOPIC:}
  production: ${APNS_PRODUCTION:false}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    root: INFO
    com.learning: DEBUG
