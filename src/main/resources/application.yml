server:
  port: ${SERVER_PORT:8095}

spring:
  application:
    name: learning-utility
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5433}/${POSTGRES_DB:utility}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres}
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  security:
    user:
      # Baseline auth gate for /totp/** (see SecurityConfig) — a single shared credential, not
      # per-account authorization. Override both via env vars for anything beyond local dev.
      name: ${TOTP_ADMIN_USER:admin}
      password: ${TOTP_ADMIN_PASSWORD:local-dev-only-change-me}

totp:
  # AES-256-GCM key (base64, 32 bytes) the secret column is encrypted with. This default is a
  # fixed local-dev placeholder committed to source — it must be overridden via
  # TOTP_SECRET_ENCRYPTION_KEY for any shared/non-local environment, otherwise every deployment
  # trusts the same key and encryption-at-rest buys nothing.
  secret-encryption-key: ${TOTP_SECRET_ENCRYPTION_KEY:tVaztoUpCpUI5bxM28kEJ0blIoHZ7BHNn9vW4qS3YWw=}

apns:
  # Token-based APNs auth (.p8 signing key) — doesn't expire like a .p12 certificate.
  enabled: ${APNS_ENABLED:false}
  signing-key-path: ${APNS_SIGNING_KEY_PATH:}
  team-id: ${APNS_TEAM_ID:}
  key-id: ${APNS_KEY_ID:}
  topic: ${APNS_TOPIC:}
  production: ${APNS_PRODUCTION:false}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    root: INFO
    com.learning: DEBUG
