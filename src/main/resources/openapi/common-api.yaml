openapi: 3.0.3
info:
  title: "learning-utility :: Common API"
  description: Shared error schema used by every endpoint. Models only — generated by openapi-generator-maven-plugin.
  version: 1.0.0
paths: { }
components:
  schemas:
    ApiError:
      type: object
      description: Standard error body returned for any failed request.
      required:
        - timestamp
        - status
        - error
        - message
      properties:
        timestamp:
          type: string
          format: date-time
        status:
          type: integer
          example: 400
        error:
          type: string
          example: "Bad Request"
        message:
          type: string
          example: "No QR code could be found in the uploaded image"
