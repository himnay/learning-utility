openapi: 3.0.3
info:
  title: "learning-utility :: QR Code API"
  description: Schemas for the QR code scanning endpoints (com.learning.qr). Models only — generated by openapi-generator-maven-plugin; the controller/service are hand-written.
  version: 1.0.0
paths: { }
components:
  schemas:
    QrDecodeResponse:
      type: object
      description: Result of decoding an uploaded QR code image.
      required:
        - text
        - format
      properties:
        text:
          type: string
          description: The raw text/data encoded in the QR code.
          example: "https://example.com"
        format:
          type: string
          description: Barcode format ZXing detected (always QR_CODE for this endpoint).
          example: "QR_CODE"
