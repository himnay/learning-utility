openapi: 3.0.3
info:
  title: "learning-utility :: Notification API"
  description: Schemas for the Apple Push Notification (APNs) endpoints (com.learning.notification), sent via the Pushy client library. Models only — generated by openapi-generator-maven-plugin; the controller/service are hand-written.
  version: 1.0.0
paths: { }
components:
  schemas:
    NotificationSendRequest:
      type: object
      required:
        - deviceToken
        - title
        - body
      properties:
        deviceToken:
          type: string
          minLength: 64
          maxLength: 64
          pattern: "^[0-9a-fA-F]{64}$"
          description: Hex-encoded APNs device token the iOS app receives when it registers for remote notifications.
          example: "740f4707bebcf74f9b7c25d48e3358945f6aa01da5ddb387462c7eaf61bb78a"
        title:
          type: string
          minLength: 1
          maxLength: 200
          example: "New message"
        body:
          type: string
          minLength: 1
          maxLength: 1000
          example: "You've got a new message from Alice."
        badge:
          type: integer
          minimum: 0
          description: Number to display on the app icon badge. Omit to leave the badge unchanged.
          example: 1
    NotificationSendResponse:
      type: object
      description: Result of submitting the notification to APNs.
      required:
        - accepted
        - apnsId
      properties:
        accepted:
          type: boolean
          description: Whether APNs accepted the notification for delivery.
          example: true
        apnsId:
          type: string
          description: APNs-assigned identifier for this notification attempt.
          example: "9f595474-5fc7-4b45-a4a8-2a9d8ee1c4a0"
        rejectionReason:
          type: string
          nullable: true
          description: Reason APNs rejected the notification, present only when accepted is false.
          example: "BadDeviceToken"
