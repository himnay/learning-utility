services:
  postgres:
    image: postgres:19beta3  # PostgreSQL 19 is still in beta (as of Sep 2026); use 18 for anything stable
    container_name: learning-utility-postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: utility
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres-data:/var/lib/postgresql   # PG18+: mount the parent dir (versioned subdir layout)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d utility"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  postgres-data:
