openapi: 3.0.3
info:
  title: "learning-utility :: TOTP API"
  description: Schemas for the time-based one-time-password endpoints (com.learning.totp). Models only — generated by openapi-generator-maven-plugin; the controller/service are hand-written.
  version: 1.0.0
paths: { }
components:
  schemas:
    TotpGenerateRequest:
      type: object
      required:
        - accountName
      properties:
        accountName:
          type: string
          minLength: 1
          maxLength: 100
          description: Identifier the seed is stored under (e.g. a username or email).
          example: "alice@example.com"
    TotpGenerateResponse:
      type: object
      description: A freshly generated TOTP seed and its current code, returned once for enrollment.
      required:
        - accountName
        - secret
        - currentCode
        - otpAuthUri
      properties:
        accountName:
          type: string
          example: "alice@example.com"
        secret:
          type: string
          description: Base32-encoded seed. Persisted server-side; shown here only at enrollment time.
          example: "JBSWY3DPEHPK3PXP"
        currentCode:
          type: string
          description: The 6-digit TOTP code valid right now for this seed (demo convenience — normally computed client-side by an authenticator app).
          example: "123456"
        otpAuthUri:
          type: string
          description: otpauth:// URI suitable for rendering as a QR code in an authenticator app.
          example: "otpauth://totp/learning-utility:alice@example.com?secret=JBSWY3DPEHPK3PXP&issuer=learning-utility"
    TotpVerifyRequest:
      type: object
      required:
        - accountName
        - code
      properties:
        accountName:
          type: string
          minLength: 1
          maxLength: 100
          example: "alice@example.com"
        code:
          type: string
          minLength: 6
          maxLength: 6
          pattern: "^[0-9]{6}$"
          example: "123456"
    TotpVerifyResponse:
      type: object
      required:
        - valid
      properties:
        valid:
          type: boolean
          example: true
